/* Layout: a mall of separate showrooms. Deep-sea hero with an interactive dot field, a velocity marquee of shop names,

:root{

  --bg:#F4EFE7; --surface:#FFFFFF; --ink:#0F1E36; --muted:#5D6574; --line:#E3D9C9;

  --grad-x:linear-gradient(120deg,#0C1C38 0%,#1E3A6B 45%,#8C93A6 78%,#E3D3B8 100%);
  --gold:linear-gradient(135deg,#EBDDC3 0%,#C9A774 55%,#A9824F 100%);
  --shadow:rgba(15,30,54,.28);
  --f-display:Alexandria,"IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --nav-h:64px;
}

  --grad:linear-gradient(180deg,#070F1E 0%,#132A52 40%,#2E4A7A 68%,#6F7891 86%,#B9A786 100%);
  --grad-x:linear-gradient(120deg,#070F1E 0%,#16305C 45%,#5B6A88 78%,#B9A786 100%);
  --shadow:rgba(0,0,0,.55); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#111C2F; --ink:#F0E9DD; --muted:#9BA4B4; --line:#23324D;
  --sea:#93B2E2; --deep:#070F1E; --coral:#D8B887; --soft:#17243A; --beige:#D6C3A1; --ok:#5BC596; --warn:#E7A23B;
  --grad:linear-gradient(180deg,#070F1E 0%,#132A52 40%,#2E4A7A 68%,#6F7891 86%,#B9A786 100%);

.num{ font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; display:inline-block }
.eyebrow{ font-size:12px; letter-spacing:.08em; font-weight:600; text-transform:uppercase; color:var(--muted) }

  transition:--sx .5s cubic-bezier(.2,.8,.2,1), --sy .5s cubic-bezier(.2,.8,.2,1), --sb .5s cubic-bezier(.2,.8,.2,1), --sa .5s; transform-style:preserve-3d; will-change:transform }

.chip{ border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:.4rem .95rem; font-size:13.5px; font-weight:500; white-space:nowrap; cursor:pointer; transition:all .2s }

.field{ width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:12px; padding:.65rem .85rem }
.lbl{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:.35rem }
:focus-visible{ outline:2px solid var(--coral); outline-offset:3px }

.size{ min-width:2.7rem; text-align:center; border:1px solid var(--line); border-radius:10px; padding:.3rem .55rem; font-size:13px; font-variant-numeric:tabular-nums; background:var(--surface); color:var(--ink) }
.size.out{ color:var(--muted); text-decoration:line-through; opacity:.55 }
.size.sel{ background:var(--ink); color:var(--bg); border-color:var(--ink) }

/* nav */
.nav{ position:sticky; top:env(safe-area-inset-top,0px); z-index:60; background:color-mix(in srgb,var(--surface) 82%,transparent); backdrop-filter:saturate(1.4) blur(14px); border-bottom:1px solid var(--line) }
.navlink{ padding:.45rem .85rem; border-radius:999px; font-size:14px; font-weight:600; color:var(--muted); white-space:nowrap }
.navlink:hover{ color:var(--ink) }
.navlink[aria-current="page"]{ color:var(--ink); background:var(--soft) }

/* hero */
.hero{ position:relative; background:var(--grad); color:#F4EFE7; overflow:hidden; isolation:isolate }
.dotfield{ position:absolute; inset:0; overflow:hidden; z-index:-1; pointer-events:none; contain:strict }
.dotfield canvas{ position:absolute; top:0; left:0; display:block }
.hero::after{ content:""; position:absolute; inset:0; z-index:-1; background:radial-gradient(55% 40% at 80% 6%, rgba(227,211,184,.22), transparent 65%), radial-gradient(50% 45% at 12% 30%, rgba(93,128,190,.35), transparent 65%); pointer-events:none }
.bento{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:150px; gap:12px; grid-auto-flow:dense }
@media (min-width:640px){ .bento{ grid-template-columns:repeat(4,minmax(0,1fr)); grid-auto-rows:170px; gap:14px } }
@media (min-width:1024px){ .bento{ grid-template-columns:repeat(6,minmax(0,1fr)); grid-auto-rows:190px; gap:16px } }
.tile{ position:relative; border-radius:20px; overflow:hidden; cursor:pointer; background:var(--surface); text-align:start; min-width:0 }
.tile.tall{ grid-row:span 2 } .tile.wide{ grid-column:span 2 }
@media (max-width:639px){ .tile.m-hide{ display:none } }
.tile > .art, .tile > img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .9s cubic-bezier(.2,.8,.2,1) }
.tile:hover > .art, .tile:hover > img{ transform:scale(1.06) }
.tile-cap{ position:absolute; inset-inline:10px; bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:.5rem; padding:.5rem .7rem; border-radius:12px;
  background:color-mix(in srgb,#0C1C38 62%,transparent); color:#F4EFE7; backdrop-filter:blur(10px); font-size:12.5px; transform:translateY(6px); opacity:.0; transition:all .45s cubic-bezier(.2,.8,.2,1) }
.tile:hover .tile-cap, .tile:focus-visible .tile-cap{ opacity:1; transform:none }
@media (hover:none){ .tile-cap{ opacity:1; transform:none } }

/* marquee */
.marquee{ overflow:hidden; border-block:1px solid var(--line); background:var(--surface); direction:ltr }
.marquee-track{ display:flex; width:max-content; will-change:transform }
.marquee-item{ font-family:var(--f-display); font-weight:800; font-size:clamp(28px,5vw,56px); padding-inline:1.6rem; white-space:nowrap; display:flex; align-items:center; gap:1.6rem; cursor:pointer; line-height:1.6 }
.marquee-item .o{ color:transparent; -webkit-text-stroke:1.2px var(--ink) }
.marquee-item:hover .o{ color:var(--ink) }
.marquee{ background:linear-gradient(90deg,var(--surface),var(--soft),var(--surface)) }
.marquee-dot{ width:.32em; height:.32em; border-radius:50%; display:inline-block }

.spot{ position:relative; overflow:hidden; border-radius:22px; border:1px solid var(--line); background:var(--surface); transition:border-color .3s }
.spot::before{ content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .35s; background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%), color-mix(in srgb,var(--brand,var(--sea)) 22%,transparent), transparent 60%); z-index:2 }
.spot:hover::before{ opacity:1 }
.spot:hover{ border-color:color-mix(in srgb,var(--brand,var(--sea)) 55%,var(--line)) }

.pc{ display:flex; flex-direction:column; gap:.7rem; cursor:pointer; text-align:start; animation:rise .7s cubic-bezier(.2,.8,.2,1) both }
.pc-img{ position:relative; aspect-ratio:4/5; max-width:100%; border-radius:18px; overflow:hidden; background:var(--soft); isolation:isolate }

.tag{ font-size:11.5px; font-weight:700; border-radius:999px; padding:.2rem .6rem }

/* SplitText — يقسم العربي لكلمات (حتى ما تنقطع الحروف) والإنجليزي لحروف */
function SplitHeading({ text, as:Tag = 'h1', className, style, delay = 0, stagger }){
  const ref = useRef(null); const { lang } = useApp();
  useLayoutEffect(() => {
    if(REDUCED || !ref.current) return;
    const type = lang === 'ar' ? 'words' : 'chars';
    const st = new SplitText(ref.current, { type: type === 'chars' ? 'words,chars' : 'words', wordsClass:'sw-word' });
    const targets = type === 'chars' ? st.chars : st.words;
    const tw = gsap.fromTo(targets, { opacity:0, y:36, filter:'blur(10px)' }, { opacity:1, y:0, filter:'blur(0px)', duration:.9, ease:'power3.out', stagger: stagger ?? (type === 'chars' ? .025 : .07), delay });
    return () => { tw.kill(); st.revert(); };
  }, [text, lang]);
  return <Tag ref={ref} key={text} className={className} style={style}>{text}</Tag>;
}

/* BlurText */
function BlurText({ text, className, delay = .35 }){
  const ref = useRef(null);
  useLayoutEffect(() => {
    if(REDUCED || !ref.current) return;
    const st = new SplitText(ref.current, { type:'words', wordsClass:'sw-word' });
    const tw = gsap.fromTo(st.words, { opacity:0, filter:'blur(8px)' }, { opacity:1, filter:'blur(0px)', duration:.7, stagger:.025, delay, ease:'power2.out' });
    return () => { tw.kill(); st.revert(); };
  }, [text]);
  return <p ref={ref} key={text} className={className}>{text}</p>;
}

/* Magnet */
function Magnet({ children, strength = .28 }){
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if(!el || !FINE || REDUCED) return;
    const xTo = gsap.quickTo(el, 'x', { duration:.5, ease:'power3' }), yTo = gsap.quickTo(el, 'y', { duration:.5, ease:'power3' });
    const move = e => { const r = el.getBoundingClientRect(); xTo((e.clientX - (r.left + r.width/2)) * strength); yTo((e.clientY - (r.top + r.height/2)) * strength); };
    const leave = () => { xTo(0); yTo(0); };
    el.addEventListener('pointermove', move); el.addEventListener('pointerleave', leave);
    return () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerleave', leave); };
  }, []);
  return <span ref={ref} style={{ display:'inline-block' }}>{children}</span>;
}

/* Tilt — ميلان ثلاثي الأبعاد وظل يتحرك عكس المؤشر كأنه مصدر ضوء */
function Tilt({ as:Tag = 'div', className = '', max = 6, children, ...rest }){
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if(!el || !FINE || REDUCED) return;
    gsap.set(el, { transformPerspective:900 });
    const rx = gsap.quickTo(el, 'rotationX', { duration:.6, ease:'power3' }), ry = gsap.quickTo(el, 'rotationY', { duration:.6, ease:'power3' });
    const move = e => { const r = el.getBoundingClientRect(); const px = (e.clientX - r.left)/r.width - .5, py = (e.clientY - r.top)/r.height - .5;
      ry(px * max * 2); rx(-py * max * 2); el.style.setProperty('--sx', (-px * 26) + 'px'); el.style.setProperty('--sy', (16 - py * 24) + 'px'); };
    const enter = () => el.classList.add('on');
    const leave = () => { rx(0); ry(0); el.classList.remove('on'); el.style.setProperty('--sx', '0px'); el.style.setProperty('--sy', '14px'); };
    el.addEventListener('pointerenter', enter); el.addEventListener('pointermove', move); el.addEventListener('pointerleave', leave);
    return () => { el.removeEventListener('pointerenter', enter); el.removeEventListener('pointermove', move); el.removeEventListener('pointerleave', leave); };
  }, []);
  return <Tag ref={ref} className={'lift ' + className} {...rest}>{children}</Tag>;
}

/* SpotlightCard */
function SpotlightCard({ children, className = '', brand, style, ...rest }){
  const move = e => { const r = e.currentTarget.getBoundingClientRect(); e.currentTarget.style.setProperty('--mx', (e.clientX - r.left) + 'px'); e.currentTarget.style.setProperty('--my', (e.clientY - r.top) + 'px'); };
  return <div className={'spot ' + className} style={{ '--brand':brand, ...style }} onPointerMove={move} {...rest}>{children}</div>;
}

/* DotGrid — شبكة نقاط تتفاعل مع المؤشر */
function DotGrid({ gap = 26, size = 2.2, radius = 150 }){
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current, ctx = cv.getContext('2d');
    let w, h, dots = [], dpr = Math.min(2, devicePixelRatio || 1), mx = -999, my = -999, raf, visible = true;
    const base = [196, 208, 232], hot = hexRgb('#E8D9BF');
    const box = cv.parentElement;
    const build = () => { w = box.clientWidth; h = box.clientHeight; if(!w || !h) return; cv.style.width = w + 'px'; cv.style.height = h + 'px'; cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); dots = [];
      for(let y = gap/2; y < h; y += gap) for(let x = gap/2; x < w; x += gap) dots.push({ x, y, ox:0, oy:0 }); };
    const draw = () => {
      ctx.clearRect(0,0,w,h);
      for(const d of dots){
        const dx = d.x - mx, dy = d.y - my, dist = Math.hypot(dx, dy), t = Math.max(0, 1 - dist/radius);
        const tx = dist ? dx/dist * t * 14 : 0, ty = dist ? dy/dist * t * 14 : 0;
        d.ox += (tx - d.ox) * .12; d.oy += (ty - d.oy) * .12;
        const c = base.map((v,i) => Math.round(v + (hot[i]-v) * t));
        ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${.18 + t*.75})`;
        ctx.beginPath(); ctx.arc(d.x + d.ox, d.y + d.oy, size * (1 + t*.9), 0, 6.283); ctx.fill();
      }
      if(!REDUCED && visible) raf = requestAnimationFrame(draw);
    };
    build(); draw();
    let lastW = w, lastH = h;
    let rf;
    const ro = new ResizeObserver(() => { cancelAnimationFrame(rf); rf = requestAnimationFrame(() => { if(box.clientWidth === lastW && box.clientHeight === lastH) return; lastW = box.clientWidth; lastH = box.clientHeight; build(); if(REDUCED) draw(); }); });
    ro.observe(box);
    const host = box.parentElement;
    const pm = e => { const r = cv.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; };
    const pl = () => { mx = -999; my = -999; };
    host.addEventListener('pointermove', pm); host.addEventListener('pointerleave', pl);
    const io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; if(visible && !REDUCED){ cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); } }); io.observe(cv);
    return () => { cancelAnimationFrame(raf); cancelAnimationFrame(rf); ro.disconnect(); io.disconnect(); host.removeEventListener('pointermove', pm); host.removeEventListener('pointerleave', pl); };
  }, []);
  return <div className="dotfield" aria-hidden="true"><canvas ref={ref} /></div>;
}

/* ScrollVelocity — شريط أسماء المحلات يتسارع مع سرعة التمرير */
function VelocityMarquee({ stores }){
  const { L } = useApp(); const track = useRef(null);
  useEffect(() => {
    const el = track.current; if(!el || REDUCED) return;
    let x = 0, dir = -1, half = el.scrollWidth / 2;
    const ro = new ResizeObserver(() => { half = el.scrollWidth / 2; }); ro.observe(el);
    const tick = (time, dt) => {
      const v = window.__lenis ? window.__lenis.velocity : 0;
      if(v > .5) dir = -1; else if(v < -.5) dir = 1;
      x += dir * (0.045 + Math.min(Math.abs(v), 60) * 0.012) * dt;
      x = gsap.utils.wrap(-half, 0, x);
      el.style.transform = `translate3d(${x}px,0,0)`;
    };
    gsap.ticker.add(tick);
    return () => { gsap.ticker.remove(tick); ro.disconnect(); };
  }, [stores.length]);
  const row = stores.map((s, i) => (
    <a key={s.id + '-' + i} href={'#store-' + s.id} className="marquee-item">
      <span className={i % 2 ? 'o' : ''}>{L(s.name)}</span>
      <span className="marquee-dot" style={{ background:s.color }} />
    </a>
  ));
  return <div className="marquee" aria-label="shops"><div ref={track} className="marquee-track">{row}{row}</div></div>;
}

/* CountUp */
function CountUp({ to }){
  const ref = useRef(null);
  useEffect(() => {
    if(REDUCED || !ref.current) return;
    const o = { v:0 }; const tw = gsap.to(o, { v:to, duration:1.3, ease:'power2.out', onUpdate:() => { if(ref.current) ref.current.textContent = Math.round(o.v); } });
    return () => tw.kill();
  }, [to]);
  return <span ref={ref} className="num">{to}</span>;
}

/* إظهار الأقسام عند التمرير */
function useReveal(dep){
  useLayoutEffect(() => {
    if(REDUCED) return;
    const els = gsap.utils.toArray('.rv'); if(!els.length) return;
    const vh = innerHeight;
    const below = els.filter(e => e.getBoundingClientRect().top > vh * .92);
    gsap.set(below, { opacity:0, y:40 });
    const trig = ScrollTrigger.batch(below, { start:'top 90%', once:true, onEnter: b => gsap.to(b, { opacity:1, y:0, duration:.9, stagger:.08, ease:'power3.out' }) });
    const sec = setTimeout(() => ScrollTrigger.refresh(), 300);
    return () => { clearTimeout(sec); trig.forEach(t => t.kill()); gsap.set(below, { clearProps:'opacity,transform' }); };
  }, [dep]);
}

function Sheet({ id, onClose }){
  const { t, L, db, lang, update, toast } = useApp();
  const p = db.products.find(x => x.id === id), s = p && db.stores.find(x => x.id === p.store);
  const [size, setSize] = useState(() => p?.sizes.find(z => z.q > 0)?.s || null);
  const [reserve, setReserve] = useState(false);
  const [name, setName] = useState(''), [phone, setPhone] = useState('');
  const panel = useRef(null), scrim = useRef(null), closing = useRef(false);
  const mobile = matchMedia('(max-width: 767px)').matches;
  useLayoutEffect(() => {
    window.__lenis?.stop();
    if(!REDUCED){
      gsap.fromTo(scrim.current, { opacity:0 }, { opacity:1, duration:.3 });
      gsap.fromTo(panel.current, mobile ? { yPercent:100 } : { xPercent: lang === 'ar' ? -100 : 100 }, { yPercent:0, xPercent:0, duration:.55, ease:'expo.out' });
    }
    const key = e => { if(e.key === 'Escape') close(); };
    addEventListener('keydown', key);
    panel.current?.focus();
    return () => { removeEventListener('keydown', key); window.__lenis?.start(); };
  }, []);
  const close = () => {
    if(closing.current) return; closing.current = true;
    if(REDUCED) return onClose();
    gsap.to(scrim.current, { opacity:0, duration:.25 });
    gsap.to(panel.current, { ...(mobile ? { yPercent:100 } : { xPercent: lang === 'ar' ? -100 : 100 }), duration:.35, ease:'power3.in', onComplete:onClose });
  };
  if(!p || !s) return null;
  const off = p.old && p.old > p.price ? Math.round((1 - p.price/p.old) * 100) : 0;
  const waText = t('wa_msg').replace('{p}', L(p.name)).replace('{price}', money(p.price)).replace('{s}', size || '-');
  const wa = 'https://wa.me/962' + String(s.phone).replace(/\D/g, '').replace(/^0/, '') + '?text=' + encodeURIComponent(waText);
  const send = e => {
    e.preventDefault();
    if(!size) return toast(t('m_need_size'));
    if(!name.trim() || !phone.trim()) return toast(t('m_need_info'));
    update(d => { d.orders.push({ id:uid('o'), store:s.id, product:p.id, size, name:name.trim(), phone:phone.trim(), status:'new', t:Date.now() }); });
    setReserve(false); setName(''); setPhone(''); toast(t('m_done'));
  };
  return (
    <>
      <div ref={scrim} className="scrim" onClick={close} />
      <aside ref={panel} className="sheet" role="dialog" aria-modal="true" aria-label={L(p.name)} tabIndex={-1} data-lenis-prevent>
        <div className="relative aspect-[4/4] sm:aspect-[5/4]"><ProductVisual p={p} brand={s.color} />
          <button className="absolute top-4 end-4 w-10 h-10 grid place-items-center rounded-full bg-surface border border-line" onClick={close} aria-label={t('close')}>
            <svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.4"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
          <a href={'#store-' + s.id} onClick={close} className="absolute bottom-4 start-4 flex items-center gap-2 rounded-full px-3.5 py-1.5 text-sm font-semibold" style={{ background:s.color, color:onBrand(s.color) }}>{L(s.name)}</a>
        </div>
        <div className="p-6 sm:p-8 flex flex-col gap-6">
          <div>
            <div className="text-sm text-muted mb-1">{t('cat_' + p.cat)} · <span className="num">{p.views}</span> {t('m_views')}</div>
            <h2 className="text-3xl font-extrabold mb-3">{L(p.name)}</h2>
            <div className="flex items-baseline gap-3">
              <span className="text-2xl font-bold"><span className="num">{money(p.price)}</span> {t('jd')}</span>
              {off > 0 && <><span className="text-muted line-through num">{money(p.old)}</span><span className="tag bg-coral text-white">{t('sale')} <span className="num">{off}%</span></span></>}
            </div>
          </div>
          <div>
            <div className="lbl">{t('m_sizes')}</div>
            <div className="flex flex-wrap gap-2">{p.sizes.map(z => <button key={z.s} disabled={z.q <= 0} className={'size !py-1.5 ' + (z.q > 0 ? '' : 'out ') + (size === z.s ? 'sel' : '')} onClick={() => setSize(z.s)}>{z.s}</button>)}</div>
          </div>
          {L(p.desc) && <div><div className="lbl">{t('m_desc')}</div><p>{L(p.desc)}</p></div>}
          <div className="grid gap-2.5">
            <a className="btn btn-ink" href={wa} target="_blank" rel="noopener"><WaIcon /> {t('m_ask')}</a>
            <p className="text-sm text-muted text-center"><span className="num">{s.phone}</span> · {L(s.area)} · {L(s.hours)}</p>
            <button className="btn btn-line" onClick={() => size ? setReserve(r => !r) : toast(t('m_need_size'))}>{t('m_reserve')}</button>
          </div>
          {reserve && (
            <form className="grid sm:grid-cols-2 gap-3 p-4 rounded-2xl bg-soft" onSubmit={send} noValidate>
              <div><label className="lbl" htmlFor="r-name">{t('m_name')}</label><input id="r-name" className="field" value={name} onChange={e => setName(e.target.value)} autoComplete="name" /></div>
              <div><label className="lbl" htmlFor="r-phone">{t('m_phone')}</label><input id="r-phone" className="field num w-full" dir="ltr" inputMode="tel" placeholder="07XXXXXXXX" value={phone} onChange={e => setPhone(e.target.value)} /></div>
              <button className="btn btn-coral sm:col-span-2" type="submit">{t('m_send')} · <span className="num">{size}</span></button>
            </form>
          )}
        </div>
      </aside>
    </>
  );
}

function compressImage(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const max = 560, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .8));
    }; img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function relTime(ts, lang){
  const m = Math.round((Date.now() - ts)/60000), f = new Intl.RelativeTimeFormat(lang, { numeric:'auto' });
  if(m < 60) return f.format(-m, 'minute'); if(m < 1440) return f.format(-Math.round(m/60), 'hour'); return f.format(-Math.round(m/1440), 'day');
}

}

function ItemForm({ sid, brand, editId, done }){
  const { t, L, db, update, toast } = useApp();
  const ex = editId && db.products.find(p => p.id === editId);
  const [f, setF] = useState(() => ex
    ? { name_ar:ex.name.ar, name_en:ex.name.en, desc:ex.desc ? (ex.desc.ar || '') : '', cat:ex.cat, price:ex.price, old:ex.old || '', sizes:ex.sizes.filter(z => z.q > 0).map(z => z.s), color:ex.color, img:ex.img || null, shape:ex.shape }
    : { name_ar:'', name_en:'', desc:'', cat:'men', price:'', old:'', sizes:[], color:'#3D5A80', img:null });
  const set = (k, v) => setF(o => ({ ...o, [k]:v }));
  const submit = e => {
    e.preventDefault();
    const pr = parseFloat(f.price), old = parseFloat(f.old);
    if(!(f.name_ar.trim() || f.name_en.trim()) || !(pr > 0) || !f.sizes.length) return toast(t('a_err'));
    const data = { cat:f.cat, shape: ex && ex.cat === f.cat ? ex.shape : DEFAULT_SHAPE[f.cat], name:{ ar:f.name_ar.trim() || f.name_en.trim(), en:f.name_en.trim() || f.name_ar.trim() }, desc:{ ar:f.desc.trim(), en:f.desc.trim() }, price:pr, old: old > pr ? old : null, color:f.color, img:f.img };
    update(d => {
      if(ex){ const p = d.products.find(x => x.id === ex.id); const prev = Object.fromEntries(p.sizes.map(z => [z.s, z.q])); Object.assign(p, data, { sizes:SIZESETS[f.cat].map(s => ({ s, q: f.sizes.includes(s) ? Math.max(1, prev[s] || 0) : 0 })) }); }
      else d.products.push({ id:uid('p'), store:sid, views:0, t:Date.now(), ...data, sizes:SIZESETS[f.cat].map(s => ({ s, q: f.sizes.includes(s) ? 1 : 0 })) });
    });
    toast(t('a_saved')); done();
  };
  const preview = { cat:f.cat, color:f.color, img:f.img, shape: ex && ex.cat === f.cat ? ex.shape : DEFAULT_SHAPE[f.cat] };
  return (
    <form className="grid lg:grid-cols-[1fr_240px] gap-8" onSubmit={submit} noValidate>
      <div className="grid sm:grid-cols-2 gap-4 min0">
        <div><label className="lbl" htmlFor="a-ar">{t('a_name_ar')}</label><input id="a-ar" className="field" dir="rtl" value={f.name_ar} onChange={e => set('name_ar', e.target.value)} /></div>
        <div><label className="lbl" htmlFor="a-en">{t('a_name_en')}</label><input id="a-en" className="field" dir="ltr" value={f.name_en} onChange={e => set('name_en', e.target.value)} /></div>
        <div className="sm:col-span-2"><label className="lbl" htmlFor="a-desc">{t('a_desc')}</label><input id="a-desc" className="field" value={f.desc} onChange={e => set('desc', e.target.value)} /></div>
        <div><label className="lbl" htmlFor="a-cat">{t('a_cat')}</label><select id="a-cat" className="field" value={f.cat} onChange={e => setF(o => ({ ...o, cat:e.target.value, sizes:[] }))}>{CATS.map(c => <option key={c} value={c}>{t('cat_' + c)}</option>)}</select></div>
        <div><label className="lbl" htmlFor="a-color">{t('a_color')}</label><input id="a-color" type="color" className="field !p-1 h-[46px]" value={f.color} onChange={e => set('color', e.target.value)} /></div>
        <div><label className="lbl" htmlFor="a-price">{t('a_price')}</label><input id="a-price" type="number" min="0" step="0.5" className="field num w-full" value={f.price} onChange={e => set('price', e.target.value)} placeholder="0.000" /></div>
        <div><label className="lbl" htmlFor="a-old">{t('a_old')}</label><input id="a-old" type="number" min="0" step="0.5" className="field num w-full" value={f.old} onChange={e => set('old', e.target.value)} placeholder="—" /></div>
        <div className="sm:col-span-2"><span className="lbl">{t('a_sizes')}</span><div className="flex flex-wrap gap-2">{SIZESETS[f.cat].map(z => <button type="button" key={z} className={'size !py-1.5 ' + (f.sizes.includes(z) ? 'sel' : '')} onClick={() => set('sizes', f.sizes.includes(z) ? f.sizes.filter(x => x !== z) : [...f.sizes, z])}>{z}</button>)}</div></div>
        <div className="sm:col-span-2"><label className="lbl" htmlFor="a-img">{t('a_img')}</label>
          <input id="a-img" type="file" accept="image/*" className="field" onChange={async e => { const file = e.target.files[0]; if(!file) return; try { set('img', await compressImage(file)); } catch(err){ toast(t('storage_full')); } }} />
          <p className="text-xs text-muted mt-1">{t('a_img_hint')}</p></div>
        <div className="sm:col-span-2 flex flex-wrap gap-2"><button className="btn btn-ink" type="submit">{ex ? t('a_update') : t('a_save')}</button>{ex && <button type="button" className="btn btn-line" onClick={done}>{t('cancel')}</button>}</div>
      </div>
      <div className="min0">
        <div className="pc-img"><ProductVisual p={preview} brand={brand} /></div>
        <div className="mt-3 font-semibold clamp1">{(L({ ar:f.name_ar, en:f.name_en })) || '—'}</div>
        {f.price && <div className="text-sm"><span className="num">{money(f.price || 0)}</span> {t('jd')}</div>}
        {f.img && <button type="button" className="text-sm text-coral mt-1" onClick={() => set('img', null)}>{t('a_rm_img')}</button>}
      </div>
    </form>
  );
}

function ProfileForm({ s }){
  const { t, update, toast, lang } = useApp();
  const [f, setF] = useState({ nar:s.name.ar, nen:s.name.en, tar:s.tag.ar, ten:s.tag.en, aar:s.area.ar, aen:s.area.en, phone:s.phone, hours:s.hours[lang] || s.hours.ar, color:s.color });
  const set = (k, v) => setF(o => ({ ...o, [k]:v }));
  const submit = e => { e.preventDefault(); update(d => { const x = d.stores.find(y => y.id === s.id);
    x.name = { ar:f.nar || f.nen, en:f.nen || f.nar }; x.tag = { ar:f.tar || f.ten, en:f.ten || f.tar }; x.area = { ar:f.aar || f.aen, en:f.aen || f.aar }; x.phone = f.phone; x.hours = { ar:f.hours, en:f.hours }; x.color = f.color; }); toast(t('p_saved')); };
  const In = (k, label, dir) => <div><label className="lbl" htmlFor={'p-' + k}>{label}</label><input id={'p-' + k} className="field" dir={dir} value={f[k]} onChange={e => set(k, e.target.value)} /></div>;
  return (
    <form className="grid sm:grid-cols-2 gap-4 max-w-3xl" onSubmit={submit} noValidate>
      {In('nar', t('p_name_ar'), 'rtl')}{In('nen', t('p_name_en'), 'ltr')}
      {In('tar', t('p_tag_ar'), 'rtl')}{In('ten', t('p_tag_en'), 'ltr')}
      {In('aar', t('p_area_ar'), 'rtl')}{In('aen', t('p_area_en'), 'ltr')}
      {In('phone', t('p_phone'), 'ltr')}{In('hours', t('p_hours'))}
      <div><label className="lbl" htmlFor="p-color">{t('p_color')}</label><input id="p-color" type="color" className="field !p-1 h-[46px]" value={f.color} onChange={e => set('color', e.target.value)} /></div>
      <div className="sm:col-span-2"><button className="btn btn-ink" type="submit">{t('p_save')}</button></div>
    </form>
  );
}

/* ------------------------------ التطبيق ------------------------------ */
function App(){
  const [lang, setLangState] = useState(() => lsGet(LANG_KEY) || 'ar');
  const [db, setDb] = useState(loadDb);
  const [route, setRoute] = useState(parseHash);
  const [sheet, setSheet] = useState(null);
  const [msg, setMsg] = useState(null);
  const tm = useRef();

  const toast = m => { setMsg(m); clearTimeout(tm.current); tm.current = setTimeout(() => setMsg(null), 3200); };
  const update = (fn, replace) => setDb(d => { if(replace) return fn(); const n = structuredClone(d); fn(n); return n; });
  const setLang = l => { setLangState(l); lsSet(LANG_KEY, l); };
  const t = k => T[lang][k] ?? k;
  const L = o => o ? (o[lang] || o.ar || o.en || '') : '';
  const openProduct = id => { update(d => { const p = d.products.find(x => x.id === id); if(p) p.views = (p.views || 0) + 1; }); setSheet(id); };

  useEffect(() => { if(!lsSet(DB_KEY, db)) toast(T[lang].storage_full); }, [db]);
  useEffect(() => { document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; ScrollTrigger.refresh(); }, [lang]);
  useEffect(() => { const on = () => { setRoute(parseHash()); setSheet(null); }; addEventListener('hashchange', on); return () => removeEventListener('hashchange', on); }, []);
  useLayoutEffect(() => { scrollToTop(); }, [route.name, route.id]);
  useLayoutEffect(() => {
    if(REDUCED) return;
    const tw = gsap.fromTo('main', { opacity:0, y:18 }, { opacity:1, y:0, duration:.75, ease:'power3.out', clearProps:'transform,opacity' });
    return () => tw.kill();
  }, [route.name, route.id, lang]);

  useEffect(() => {
    if(REDUCED) return;
    const lenis = new Lenis({ lerp:.1, smoothWheel:true });
    window.__lenis = lenis;
    lenis.on('scroll', ScrollTrigger.update);
    const raf = time => lenis.raf(time * 1000);
    gsap.ticker.add(raf); gsap.ticker.lagSmoothing(0);
    return () => { gsap.ticker.remove(raf); lenis.destroy(); window.__lenis = null; };
  }, []);

  const ctx = { lang, setLang, t, L, db, update, toast, openProduct };
  const key = route.name + (route.id || '') + lang;
  return (
    <Ctx.Provider value={ctx}>
      <Nav route={route} />
      <main key={key}>
        {route.name === 'home' && <Home />}
        {route.name === 'store' && <Showroom id={route.id} />}
        {route.name === 'dashboard' && <Dashboard />}
        {route.name === 'pricing' && <Pricing />}
      </main>
      <footer className="border-t border-line"><div className="wrap text-sm text-muted flex flex-wrap gap-2 justify-between" style={{ paddingBlock:'1.6rem' }}><span className="disp font-semibold text-ink">{t('brand')} {t('city')}</span><span>{t('footer')}</span></div></footer>
      {sheet && <Sheet id={sheet} onClose={() => setSheet(null)} />}
      {msg && <div className="toast" role="status"><div>{msg}</div></div>}
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
